name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run build:rust
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:rust
      - run: npm run build
      - run: npm run lint -w soul-mate-frontend
      - run: npm run format:check -w soul-mate-frontend
      - run: cargo clippy --manifest-path packages/agent-rust/Cargo.toml --all-targets -- -D warnings
      - run: cargo clippy --manifest-path packages/embedding-core/Cargo.toml --all-targets -- -D warnings
      - run: cargo clippy --manifest-path packages/embedding-napi/Cargo.toml --all-targets -- -D warnings
      - run: cargo clippy --manifest-path packages/mcp-rust/Cargo.toml --all-targets -- -D warnings
      - run: cargo clippy --manifest-path packages/tts-rust/Cargo.toml --all-targets -- -D warnings

  package-smoke:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git D:\vcpkg
          D:\vcpkg\bootstrap-vcpkg.bat
      - run: npm ci
      - name: Build all desktop dependencies
        env:
          VCPKG_ROOT: D:\vcpkg
        run: npm run build:release
      - name: Package unpacked application
        run: npm run package:dir -w soul-mate-frontend
      - run: npm run smoke:dist
      - uses: actions/upload-artifact@v4
        with:
          name: soul-mate-windows-unpacked
          path: apps/desktop/release/win-unpacked
