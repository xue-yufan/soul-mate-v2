[package]
name = "soul-mate-mcp-rust"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "Safe Rust stdio MCP gateway for Soul Mate v2"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }

[lints.rust]
linker_messages = "allow"

[[test]]
name = "mcp_protocol"
path = "mcp_protocol_test.rs"
