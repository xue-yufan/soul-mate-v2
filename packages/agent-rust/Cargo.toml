[package]
name = "soul-mate-agent-rust"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Safe Rust Agent and embedding sidecar for Soul Mate v2"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
soul-mate-embedding-core = { path = "../embedding-core" }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }

[[test]]
name = "agent_protocol"
path = "agent_protocol_test.rs"

[profile.release]
lto = "thin"
codegen-units = 1
